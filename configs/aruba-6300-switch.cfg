!
! Aruba 6300 (AOS-CX) switch configuration
! LACP trunk, VLANs, DHCP and Apache web server lab
!
! Transcribed from the configuration screenshot
! (screenshots/17-switch-configuration.png). Lines starting with "!" are
! comments; paste the rest into the switch CLI in configuration mode.
!
! Addressing note: the configuration screenshot still shows 172.16.x.x
! addresses and /25 masks. The show/ip outputs in the other screenshots
! (sh ip int br, ip a, ip route, sh dhcp-server leases) all confirm the
! network ran on 172.20.x.x, so that scheme is used in this file.
!

! ---------------------------------------------------------------
! DHCP pools (one per VLAN)
! ---------------------------------------------------------------
dhcp-server vrf default
    pool vlan7
        range 172.20.7.1 172.20.7.126
        default-router 172.20.7.1
        exit
    pool vlan70
        range 172.20.70.1 172.20.70.126
        default-router 172.20.70.1
        exit
    enable

! ---------------------------------------------------------------
! VLAN creation and gateway interfaces (SVIs)
! ---------------------------------------------------------------
vlan 7
 exit
vlan 70
 exit
interface vlan 7
    ip address 172.20.7.1/25
    no shutdown
interface vlan 70
    ip address 172.20.70.1/25
    no shutdown

! ---------------------------------------------------------------
! LAG 1: trunk to the Aruba 2540 (VLANs 7 and 70)
! ---------------------------------------------------------------
interface lag 1
    no shutdown
    vlan trunk allowed 7,70
    exit

interface 1/1/1
    lag 1
    no shutdown

interface 1/1/2
    lag 1
    no shutdown

! ---------------------------------------------------------------
! Access port for the VLAN 7 VM (Apache web server)
! ---------------------------------------------------------------
interface 1/1/3
    vlan access 7
    no shutdown
