!
! Aruba 2540 (ArubaOS-Switch) configuration
! LACP trunk, VLANs, DHCP and Apache web server lab
!
! Transcribed from the configuration screenshot
! (screenshots/17-switch-configuration.png). Lines starting with "!" are
! comments; paste the rest into the switch CLI in configuration mode.
!
! This switch only carries the VLANs. The gateways and the DHCP server
! are on the Aruba 6300.
!

! ---------------------------------------------------------------
! LACP trunk: ports 1 and 2 to the Aruba 6300 (LAG 1)
! ---------------------------------------------------------------
trunk 1,2 trk1 lacp

! ---------------------------------------------------------------
! VLAN membership
! ---------------------------------------------------------------
vlan 7
   tagged trk1
   exit

! Port 3 is the access port for the VLAN 70 VM
vlan 70
   tagged trk1
   untagged 3
   exit
